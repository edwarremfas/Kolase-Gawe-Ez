<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1b1b1b;--mu:#666;--bd:#ddd;--ac:#c8102e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--card:#222;--tx:#eee;--mu:#aaa;--bd:#444}}
:root[data-theme="dark"]{--bg:#161616;--card:#222;--tx:#eee;--mu:#aaa;--bd:#444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:19px;margin:4px 0 12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}

textarea,select,input[type=text],button{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

#th{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
.t{flex:0 0 104px;text-align:center;font-size:11px}
.t img{width:104px;height:104px;object-fit:cover;border-radius:6px;display:block}
.t.sw img{outline:3px solid var(--ac);outline-offset:-3px}
.tb{display:flex;gap:4px;margin-top:5px}
.tb button{flex:1;min-height:40px;padding:0;font-size:15px}
#ts{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:#222;color:#fff;border:1px solid #555;border-radius:10px;padding:12px 14px;font-size:14px;white-space:pre-line;box-shadow:0 4px 16px rgba(0,0,0,.35);z-index:30;display:none}
canvas{width:100%;height:auto;border-radius:8px;border:1px solid var(--bd);display:block}
canvas.ed{touch-action:none}
input[type=date],input[type=time]{width:100%;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
#res img{width:100%;border-radius:8px;margin-top:8px}
.m{font-size:12px;color:var(--mu)}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fl{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:3px}
button.lo{padding:3px;border:2px solid var(--bd);border-radius:8px;background:var(--card);font-size:10px;color:var(--mu);line-height:1.2}
button.lo canvas{width:100%;aspect-ratio:4/5;border:0;border-radius:4px;display:block;margin-bottom:3px}
button.lo.on{border-color:var(--ac);color:var(--tx);font-weight:600}
#fg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
button.fo{padding:7px 6px 5px;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);text-align:center;line-height:1.15}
button.fo .fs{display:block;font-size:15px;letter-spacing:.5px;white-space:nowrap;overflow:hidden}
button.fo small{display:block;margin-top:5px;font:10px system-ui,sans-serif;color:var(--mu)}
button.fo.on{border-color:var(--ac)}
button.fo.on small{color:var(--tx);font-weight:600}
button.tg{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:10px;text-align:left}
button.tg b{font-weight:600;color:var(--ac)}
button.tg i{font-style:normal;color:var(--mu)}
button.tg.hd{width:fit-content;gap:8px;padding:6px 12px;border-radius:4px;background:#c8102e;border-color:#c8102e;color:#fff;font-size:12px;font-weight:700;letter-spacing:.5px}
button.tg.hd i{color:#fff}
</style></head><body><main>

<div class="c">
<canvas id="cv" class="ed"></canvas>
<button type="button" style="margin-top:8px;padding:4px 10px;font-size:11px;font-weight:600" onclick="const e=$('tut');e.style.display=e.style.display==='none'?'block':'none'">TUTOR DEK?</button>
<div class="m" id="tut" style="display:none;margin-top:6px">Geser foto untuk pindah posisi, cubit 2 jari untuk zoom, ketuk 2x foto untuk reset. Ketuk 2x banner merah untuk isi caption; banner juga bisa digeser, dicubit, atau ditarik dari pojok biru.</div>

<button class="p" style="width:100%" onclick="f.click()">+ Tambah Foto</button>

</div>

<div class="c">
<textarea id="jd" hidden></textarea>

<input id="ly" type="hidden" value="3|0|0"><div id="lg" style="display:none"><label>Kolom (maks. per baris)</label><div class="sg" id="kc"></div><label>Gaya &amp; balik susunan</label><div class="sg" id="kg"></div></div>
<label>Rasio</label><select id="rs" style="width:100%"><option value="1080,1350">Portrait 4:5</option><option value="1080,1080">Kotak 1:1</option><option value="1080,1920">Story 9:16</option></select>

<div id="zz" style="display:none">

<option value="Arial Black|900|1">Bawaan (Arial Black)</option>

<div id="fg" style="display:none"></div>
<div class="row">
<div><label>Warna Banner</label><input id="cl" type="color" value="#c8102e" style="width:100%;height:40px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)"></div>
<div><label>Lebar banner</label><select id="bw"><option value="0">Sesuai teks</option><option value="1">Penuh</option></select></div>
</div>
<label>Posisi Wuenak</label><select id="ps" style="width:100%"><option value="0.25">Atas-tengah</option><option value="0">Paling atas</option><option value="0.5">Tengah</option><option value="1">Paling bawah</option></select>

<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input id="w1" type="checkbox" style="width:auto" onchange="draw()"> Logo TELKOMSEL (kiri atas)</label>
<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input id="w2" type="checkbox" style="width:auto" onchange="draw()"> Logo BY.U (kanan atas)</label>
<label style="display:flex;gap:8px;align-items:center;color:var(--tx);margin-top:14px"><input id="st" type="checkbox" style="width:auto"> Tampilkan tanggal, jam &amp; lokasi</label>
<div class="row"><div><label>Tanggal</label><input id="dt" type="date"></div><div><label>Jam</label><input id="jam" type="time"></div></div>
<label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input id="jmc" type="checkbox" checked style="width:auto"> Sertakan jam di stempel</label>
<label>Lokasi</label><input id="lc" type="text" placeholder="mis. Cianjur">
<div class="row" style="margin-top:8px"><button onclick="gps()">📍 Koordinat GPS</button><button onclick="nowFill(1)">🕒 Tanggal &amp; jam sekarang</button></div>
</div>
</div>

<div class="m" style="text-align:center;font-size:11px;letter-spacing:.5px;margin:4px 0 18px">DIBUAT OLEH MUHAMAD EDWAR TAUFIQ HIDAYAT</div>
</main>
<div id="ts" role="status"></div>
<div id="cm" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;align-items:center;justify-content:center;padding:16px"><div class="c" style="width:100%;max-width:420px;margin:0"><label style="margin-top:0">CAPTION (Enter = baris baru)</label><textarea id="ct" rows="3" placeholder="Masukan Text"></textarea><button class="p" style="width:100%;margin-top:10px" onclick="cclose()">Selesai</button></div></div>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),x=cv.getContext('2d');
let P=[],swp=-1;
let tt=0;function toast(m,ms){const e=$('ts');e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>{e.style.display='none'},ms||Math.max(3000,m.length*55))}
$('ts').onclick=()=>{$('ts').style.display='none'};
function li(u){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=u})}
const HU=['https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js','https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js'];
function ls(u){return new Promise((r,j)=>{const t=document.createElement('script');t.src=u;t.onload=r;t.onerror=()=>{t.remove();j(new Error('x'))};document.head.appendChild(t)})}
async function lh(){if(window.heic2any)return;for(const u of HU){try{await ls(u);if(window.heic2any)return}catch(e){}}throw new Error('LIB: library HEIC tidak bisa dimuat')}
async function isHeic(fl){
if(/\.hei[cf]$/i.test(fl.name)||/hei[cf]/i.test(fl.type))return true;
try{const h=new Uint8Array(await fl.slice(0,32).arrayBuffer());return /ftyp(heic|heix|hevc|hevx|heim|heis|mif1|msf1)/.test(String.fromCharCode(...h.slice(4,32)))}catch(e){return false}}
function toJpg(im,w,h){const k=Math.min(1,4000/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',0.92))}
const WU=['https://cdn.jsdelivr.net/npm/libheif-js@1.18.2/libheif-wasm/libheif-bundle.js','https://unpkg.com/libheif-js@1.18.2/libheif-wasm/libheif-bundle.js'];
let LH=null;
async function lw(){if(LH)return LH;if(!window.libheif){for(const u of WU){try{await ls(u);if(window.libheif)break}catch(e){}}}
if(!window.libheif)throw new Error('LIB: library HEIC (wasm) tidak bisa dimuat');
let m=window.libheif;if(typeof m==='function')m=m();if(m&&!m.HeifDecoder&&typeof m.then==='function')m=await m;
if(!m||!m.HeifDecoder)throw new Error('LIB: library HEIC (wasm) tidak cocok');LH=m;return m}
async function heicWasm(fl){const L=await lw(),dec=new L.HeifDecoder(),data=dec.decode(new Uint8Array(await fl.arrayBuffer()));
if(!data||!data.length)throw new Error('HEIC tidak terbaca');
const im=data[0],w=im.get_width(),h=im.get_height(),c=document.createElement('canvas');c.width=w;c.height=h;
const g=c.getContext('2d'),id=g.createImageData(w,h);
await new Promise((res,rej)=>{im.display(id,d=>d?res():rej(new Error('Gagal decode HEIC')))});
g.putImageData(id,0,0);const b=await toJpg(c,w,h);if(!b)throw new Error('Gagal membuat JPG');return b}
async function heic(fl){
try{const u=URL.createObjectURL(fl);try{const im=await li(u),jb=await toJpg(im,im.width,im.height);if(jb)return jb}finally{URL.revokeObjectURL(u)}}catch(e){}
try{if(window.ImageDecoder&&await ImageDecoder.isTypeSupported('image/heic')){const d=new ImageDecoder({data:await fl.arrayBuffer(),type:'image/heic'}),{image}=await d.decode(),jb=await toJpg(image,image.displayWidth,image.displayHeight);image.close();if(jb)return jb}}catch(e){}
let e1,e2;
try{await lh();let b=await heic2any({blob:new Blob([fl],{type:'image/heic'}),toType:'image/jpeg',quality:0.92});return Array.isArray(b)?b[0]:b}catch(e){e1=e}
try{return await heicWasm(fl)}catch(e){e2=e}
const nl=e=>!/^LIB:/.test(String((e&&e.message)||e)),bad=[e1,e2].filter(nl);throw bad.length?bad[0]:e1}
async function down(i,u){const M=2400,m=Math.max(i.width,i.height);if(m<=M)return{i,u};
const k=M/m,w=Math.round(i.width*k),h=Math.round(i.height*k),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);
const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.92));if(!b)return{i,u};
const u2=URL.createObjectURL(b);try{const i2=await li(u2);URL.revokeObjectURL(u);return{i:i2,u:u2}}catch(e){URL.revokeObjectURL(u2);return{i,u}}}
async function add(fl){if(P.length>=20){return}let u,i;
if(await isHeic(fl)){
$('cnt').textContent='Mengonversi HEIC ke JPG: '+fl.name+'...';
try{const b=await heic(fl);u=URL.createObjectURL(b);i=await li(u)}catch(e2){
const m=String((e2&&(e2.message||e2.code))||e2),lib=/^LIB:/.test(m);
toast(lib?'Library HEIC tidak bisa diunduh. Cek internet, matikan pemblokir iklan/DNS, lalu coba lagi.':'Foto HEIC "'+fl.name+'" tidak bisa dibaca.\n'+m+'\n\nSolusi: di Galeri, bagikan/simpan foto itu sebagai JPG, lalu masukkan lagi.',9000);return}}
else{u=URL.createObjectURL(fl);try{i=await li(u)}catch(e){URL.revokeObjectURL(u);toast('Foto "'+fl.name+'" tidak bisa dibuka');return}}
;({i,u}=await down(i,u));P.push({i,u,ox:0,oy:0,z:1});ui();draw()}
$('f').onchange=async e=>{let fs=[...e.target.files];e.target.value='';const sisa=20-P.length;if(sisa<=0){toast('Maksimal 20 foto.');return}if(fs.length>sisa){toast('Maksimal 20 foto. Hanya '+sisa+' foto pertama yang dimasukkan.');fs=fs.slice(0,sisa)}$('cnt').textContent='Memproses foto...';for(const fl of fs)await add(fl);ui()};
function mv(a,b){if(b<0||b>=P.length)return;[P[a],P[b]]=[P[b],P[a]];sel=-1;swp=-1;ui();draw()}
function del(a){try{URL.revokeObjectURL(P[a].u)}catch(e){}P.splice(a,1);sel=-1;swp=-1;ui();draw()}
function pick(k){if(swp<0)swp=k;else if(swp===k)swp=-1;else{[P[swp],P[k]]=[P[k],P[swp]];swp=-1;sel=-1;draw()}ui()}
function ui(){$('th').innerHTML=P.map((p,k)=>`<div class="t${k===swp?' sw':''}"><img src="${p.u}" onclick="pick(${k})"><div class="tb"><button onclick="mv(${k},${k-1})">◀</button><button onclick="mv(${k},${k+1})">▶</button><button onclick="del(${k})">✕</button></div></div>`).join('');
$('cnt').textContent=swp>=0?'Ketuk foto lain untuk menukar posisi (ketuk lagi untuk batal)':(P.length?P.length+'/20 foto (ketuk 1 foto lalu foto lain untuk menukar)':'Belum ada foto')}
let cells=[],sel=-1,ed=true,capOn=false,cap=null,cpos=null,cs=1;
function cover(k,dx,dy,dw,dh){const p=P[k],im=p.i,r=Math.max(dw/im.width,dh/im.height)*p.z,w=im.width*r,h=im.height*r,vx=(w-dw)/2,vy=(h-dh)/2;x.save();x.beginPath();x.rect(dx,dy,dw,dh);x.clip();x.drawImage(im,dx+(dw-w)/2+p.ox*vx,dy+(dh-h)/2+p.oy*vy,w,h);x.restore();cells.push({k,dx,dy,dw,dh,vx,vy})}
function dist(N,R){const b=Math.floor(N/R),r=Array(R).fill(b),o=[...r.keys()].sort((i,j)=>Math.abs(i-(R-1)/2)-Math.abs(j-(R-1)/2)||i-j);o.slice(0,N-b*R).forEach(i=>r[i]++);return r}
function parseLy(v){return /^[1-4]\|[0-2]\|[01]$/.test(v)?v.split('|').map(Number):[3,0,0]}
function mkRows(v,N){if(N<1)return[];const[c,s,f]=parseLy(v);let r;
if(s===1&&N>1)r=[1,...dist(N-1,Math.ceil((N-1)/c))];
else{r=dist(N,Math.ceil(N/c));if(s===2&&c>1)for(let R=1;R<=N;R++){let hit=0;for(const a of[c,c-1]){const p=Array.from({length:R},(_,i)=>i%2?(a===c?c-1:c):a);if(p.reduce((x,y)=>x+y,0)===N){r=p;hit=1;break}}if(hit)break}}
return f?r.reverse():r}
function tile(cv,rows){const q=cv.getContext('2d'),W=120,H=150,gp=2;q.fillStyle='#fff';q.fillRect(0,0,W,H);const rh=(H-gp*(rows.length+1))/rows.length;let id=0;rows.forEach((n,r)=>{const cw=(W-gp*(n+1))/n;for(let j=0;j<n;j++){const im=TI[id++%TI.length],dx=gp+j*(cw+gp),dy=gp+r*(rh+gp),sc=Math.max(cw/im.width,rh/im.height),w=im.width*sc,h=im.height*sc;q.save();q.beginPath();q.rect(dx,dy,cw,rh);q.clip();q.drawImage(im,dx+(cw-w)/2,dy+(rh-h)/2,w,h);q.restore()}})}
const GN=['Rata','Besar atas','Selang'];
function setLy(i,v){const a=parseLy($('ly').value);a[i]=v;$('ly').value=a.join('|');pv();draw()}
function lb(inner,name,fn){const b=document.createElement('button');b.type='button';b.className='lo';b.innerHTML=inner+'<div>'+name+'</div>';b.onclick=fn;return b}
function mark(){const[c,s,f]=parseLy($('ly').value);[...$('kc').children].forEach((b,i)=>b.classList.toggle('on',i+1===c));[...$('kg').children].forEach((b,i)=>b.classList.toggle('on',i<3?i===s:f===1));$('lnm').textContent=c+' kolom · '+GN[s]+(f?' · Balik':'')}
let pvn=-1;
function pv(){const CV='<canvas width="120" height="150"></canvas>';
if(!$('kc').children.length){[1,2,3,4].forEach(c=>$('kc').appendChild(lb(CV,c+' kolom',()=>setLy(0,c))));GN.forEach((n,i)=>$('kg').appendChild(lb(CV,n,()=>setLy(1,i))));$('kg').appendChild(lb('<div class="fl">⇅</div>','Balik',()=>setLy(2,1-parseLy($('ly').value)[2])))}
const N=Math.min(P.length||6,12),[c,s,f]=parseLy($('ly').value);
[...$('kc').children].forEach((b,i)=>tile(b.querySelector('canvas'),mkRows([i+1,s,f].join('|'),N)));
[...$('kg').children].slice(0,3).forEach((b,i)=>tile(b.querySelector('canvas'),mkRows([c,i,f].join('|'),N)));mark()}
const TI=['#9aa5b1','#b8c4a8','#c9b8a6','#a6b8c9','#c4a8b8','#b1a59a','#a8c4c0','#c0c4a8'].map(c=>{const k=document.createElement('canvas');k.width=k.height=100;const g=k.getContext('2d');g.fillStyle=c;g.fillRect(0,0,100,100);return k});
pv();
function draw(clean){saveSoon();if(pvn!==P.length){pvn=P.length;pv()}cells=[];cap=null;

function rr(a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function lgRects(W){const h=W*0.07,m=W*0.025,r=[];
[[LG.t,'w1',1],[LG.u,'w2',0]].forEach(([im,id,left])=>{if(!$(id).checked||!im.width)return;const lh=h*0.62,lw=lh*im.width/im.height,pw=lw+h*0.5;r.push({im,x:left?m:W-m-pw,y:m,w:pw,h,lw,lh})});return r}
function wm(R){R.forEach(o=>{x.fillStyle='rgba(0,0,0,.6)';rr(o.x,o.y,o.w,o.h,o.h*0.28);x.fill();x.drawImage(o.im,o.x+(o.w-o.lw)/2,o.y+(o.h-o.lh)/2,o.lw,o.lh)})}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function dodge(r,obs,W,H){if(!obs.some(o=>hit(r,o)))return r.y;const g=W*0.01,c=[];obs.forEach(o=>c.push(o.y-r.h-g,o.y+o.h+g));
const ok=c.map(v=>Math.max(0,Math.min(H-r.h,v))).filter(v=>!obs.some(o=>hit({x:r.x,y:v,w:r.w,h:r.h},o))).sort((a,b)=>Math.abs(a-r.y)-Math.abs(b-r.y));return ok.length?ok[0]:r.y}
function stInfo(W,H,obs){if(!$('st').checked)return null;const v=$('dt').value,loc=$('lc').value.trim();try{localStorage.setItem('lk',loc)}catch(e){}
let t=v?new Date(v+'T00:00:00').toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';const tmv=$('jmc').checked?$('jam').value:'';if(tmv)t+=(t?' • ':'')+tmv.replace(':','.');if(loc)t+=(t?' • ':'')+loc;if(!t)return null;
let fz=W*0.03;x.font=`700 ${fz}px Arial,sans-serif`;const mw=W*0.9-fz*1.6,tw=x.measureText(t).width;if(tw>mw){fz*=mw/tw;x.font=`700 ${fz}px Arial,sans-serif`}
const w=x.measureText(t).width+fz*1.6,h=fz*2,o={t,fz,x:W-w-W*0.02,y:$('ps').value==='1'?W*0.02:H-h-W*0.02,w,h};o.y=dodge(o,obs,W,H);return o}
function stamp(o){if(!o)return;x.font=`700 ${o.fz}px Arial,sans-serif`;x.fillStyle='rgba(0,0,0,.6)';x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle='#fff';x.textAlign='left';x.textBaseline='middle';x.fillText(o.t,o.x+o.fz*0.8,o.y+o.h/2);x.textBaseline='alphabetic'}
function gps(){if(!navigator.geolocation){toast('GPS tidak tersedia. Ketik lokasi manual.');return}navigator.geolocation.getCurrentPosition(p=>{$('lc').value=p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5);draw()},()=>toast('Lokasi tidak bisa diambil. Ketik manual saja.'))}
let drag=null;
function openCap(){$('ct').value=$('jd').value;$('cm').style.display='flex';$('ct').focus()}
function cclose(){$('cm').style.display='none'}
$('ct').oninput=()=>{$('jd').value=$('ct').value;draw()};
function pt(e){const r=cv.getBoundingClientRect(),s=cv.width/r.width;return{x:(e.clientX-r.left)*s,y:(e.clientY-r.top)*s}}
document.addEventListener('pointerdown',e=>{if(e.target!==cv&&(sel>=0||capOn)){sel=-1;capOn=false;draw()}});
let lt=0;const ptrs=new Map();let pinch=null,pdn=null,pt2={k:-1,t:0};
function ptap(e){if(e.type!=='pointerup'||!pdn||ptrs.size!==1){pdn=null;return}
const q=pt(e),d=pdn;pdn=null;
if(Math.hypot(q.x-d.x,q.y-d.y)>cv.width*0.02){pt2={k:-1,t:0};return}
const n=Date.now();
if(pt2.k===d.k&&n-pt2.t<450){const p=P[d.k];if(p){p.ox=0;p.oy=0;p.z=1;draw()}pt2={k:-1,t:0}}else pt2={k:d.k,t:n}}
function ecp(){if(!cpos&&cap)cpos={fx:cap.x/cv.width,fy:cap.y/cv.height}}
cv.onpointerdown=e=>{if(!ed)return;pdn=null;const q=pt(e);ptrs.set(e.pointerId,q);try{cv.setPointerCapture(e.pointerId)}catch(_){}
if(drag&&(drag.cap||drag.rs)&&ptrs.size===2&&cap){const[a,b]=[...ptrs.values()];ecp();pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,cs:cs};drag=null;return}
if(drag&&!drag.cap&&!drag.rs&&sel>=0&&ptrs.size===2){const[a,b]=[...ptrs.values()];pinch={p:1,d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:P[sel].z};drag=null;return}
const hs=cv.width*0.07;
if(cap&&capOn&&q.x>=cap.x+cap.w-hs*1.3&&q.x<=cap.x+cap.w+hs*0.3&&q.y>=cap.y+cap.h-hs*1.3&&q.y<=cap.y+cap.h+hs*0.3){sel=-1;ecp();drag={rs:1,sx:q.x,w0:cap.w,cs0:cs};draw();return}
if(cap&&q.x>=cap.x&&q.x<=cap.x+cap.w&&q.y>=cap.y&&q.y<=cap.y+cap.h){sel=-1;capOn=true;ecp();drag={lx:q.x,ly:q.y,cap:1};draw();return}
const c=cells.find(c=>q.x>=c.dx&&q.x<=c.dx+c.dw&&q.y>=c.dy&&q.y<=c.dy+c.dh);if(!c){sel=-1;capOn=false;draw();return}sel=c.k;capOn=false;drag={lx:q.x,ly:q.y};pdn={x:q.x,y:q.y,k:c.k};draw()};
cv.onpointermove=e=>{const q=pt(e);if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,q);
if(pinch&&ptrs.size>=2){const[a,b]=[...ptrs.values()],r=Math.hypot(a.x-b.x,a.y-b.y)/pinch.d;if(pinch.p){if(sel>=0)P[sel].z=Math.max(1,Math.min(3,pinch.z*r))}else cs=Math.max(.3,Math.min(3,pinch.cs*r));draw();return}
if(drag&&drag.rs){cs=Math.max(.3,Math.min(3,drag.cs0*(drag.w0+(q.x-drag.sx))/drag.w0));draw();return}
if(drag&&drag.cap&&cpos&&cap){cpos.fx=Math.max(0,Math.min((cv.width-cap.w)/cv.width,cpos.fx+(q.x-drag.lx)/cv.width));cpos.fy=Math.max(0,Math.min((cv.height-cap.h)/cv.height,cpos.fy+(q.y-drag.ly)/cv.height));drag.mv=(drag.mv||0)+Math.abs(q.x-drag.lx)+Math.abs(q.y-drag.ly);drag.lx=q.x;drag.ly=q.y;draw();return}
if(!drag||sel<0)return;const c=cells.find(c=>c.k===sel),p=P[sel];if(c){if(c.vx>0)p.ox=Math.max(-1,Math.min(1,p.ox+(q.x-drag.lx)/c.vx));if(c.vy>0)p.oy=Math.max(-1,Math.min(1,p.oy+(q.y-drag.ly)/c.vy))}drag={lx:q.x,ly:q.y};draw()};
cv.onwheel=e=>{e.preventDefault();const q=pt(e),f=e.deltaY<0?1.08:1/1.08;if(cap&&q.x>=cap.x&&q.x<=cap.x+cap.w&&q.y>=cap.y&&q.y<=cap.y+cap.h)cs=Math.max(.3,Math.min(3,cs*f));else{const c=cells.find(c=>q.x>=c.dx&&q.x<=c.dx+c.dw&&q.y>=c.dy&&q.y<=c.dy+c.dh);if(c)P[c.k].z=Math.max(1,Math.min(3,P[c.k].z*f))}draw()};
cv.onpointerup=cv.onpointercancel=e=>{ptap(e);const tap=e.type==='pointerup'&&drag&&drag.cap&&(drag.mv||0)<20&&ptrs.size===1;ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size===0)drag=null;if(tap){const n=Date.now();if(n-lt<450){lt=0;openCap()}else lt=n}};
let tch=false;
function nowFill(f){const d=new Date(),p=n=>String(n).padStart(2,'0');$('dt').value=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());$('jam').value=p(d.getHours())+':'+p(d.getMinutes());if(f){tch=false;draw()}}
const SV=['ly','rs','ps','bw','cl','fs','gp','fn'],SC=['w1','w2','st','jmc'];let svt=0;
function saveS(){try{const o={};SV.forEach(i=>o[i]=$(i).value);SC.forEach(i=>o[i]=$(i).checked);localStorage.setItem('kset',JSON.stringify(o))}catch(e){}}
function saveSoon(){clearTimeout(svt);svt=setTimeout(saveS,400)}
function loadS(){try{const o=JSON.parse(localStorage.getItem('kset')||'null');if(!o)return;
SV.forEach(i=>{const el=$(i);if(o[i]==null)return;if(el.options&&![...el.options].some(op=>op.value===o[i]))return;el.value=o[i]});
SC.forEach(i=>{if(o[i]!=null)$(i).checked=!!o[i]})}catch(e){}}
nowFill();try{$('lc').value=localStorage.getItem('lk')||''}catch(e){}
loadS();pv();fmark();$('fv').textContent=$('fs').value;$('gv').textContent=$('gp').value;
{const[n,w]=$('fn').value.split('|');if(document.fonts&&document.fonts.load)document.fonts.load(w+' 40px "'+n+'"').then(()=>draw()).catch(()=>{})}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!tch){nowFill();draw()}});
;['jd','ly','rs','ps','bw','cl','fs','gp','st','dt','jam','jmc','lc'].forEach(i=>$(i).oninput=()=>{if(i==='dt'||i==='jam')tch=true;$('fv').textContent=$('fs').value;$('gv').textContent=$('gp').value;draw()});
$('ps').oninput=()=>{cpos=null;cs=1;draw()};
function tgl(id,bt,d){const e=$(id),h=e.style.display==='none';e.style.display=h?(d||'grid'):'none';$(bt).lastElementChild.textContent=h?'▴':'▾'}
function fmark(){[...$('fg').children].forEach(b=>b.classList.toggle('on',b.dataset.v===$('fn').value));const o=$('fn').selectedOptions[0];if(o)$('fnm').textContent=o.textContent.split(' - ')[0]}
$('fn').oninput=async()=>{fmark();const[n,w]=$('fn').value.split('|');try{await document.fonts.load(w+' 40px "'+n+'"')}catch(e){}draw()};
(function(){const g=$('fg');[...$('fn').options].forEach(o=>{const[n,w]=o.value.split('|'),b=document.createElement('button');b.type='button';b.className='fo';b.dataset.v=o.value;b.innerHTML=`<span class="fs" style="font:${w} 15px '${n}','Arial Black',Impact,sans-serif">EDWAR TAMVAN</span><small>${o.textContent.split(' - ')[0]}</small>`;b.onclick=()=>{$('fn').value=o.value;$('fn').oninput()};g.appendChild(b)});fmark()})();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>draw());
function unduh(){if(!P.length){toast('Tambahkan foto dulu');return}
draw(true);const jpg=$('fm').value==='jpg',tp=jpg?'image/jpeg':'image/png';
cv.toBlob(b=>{if(!b)return;const u=URL.createObjectURL(b),a=document.createElement('a'),d=new Date(),p=n=>String(n).padStart(2,'0');
a.href=u;a.download='kolase-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+'.'+(jpg?'jpg':'png');
document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)},tp,0.92);
setTimeout(draw,0)}
async function simpan(){if(!P.length){toast('Tambahkan foto dulu');return}
draw(true);
cv.toBlob(async b=>{if(!b)return;
const file=new File([b],'kolase-'+Date.now()+'.jpg',{type:'image/jpeg'});
try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e.name==='AbortError')return}
const u=URL.createObjectURL(b);$('res').innerHTML='Tekan lama gambar di bawah, lalu pilih "Simpan gambar":<img src="'+u+'">';
},'image/jpeg',0.92);
setTimeout(draw,0)}
draw();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
